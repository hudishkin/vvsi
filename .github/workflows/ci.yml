name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    name: Swift ${{ matrix.language }} / Xcode ${{ matrix.xcode }}
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '16.4'
            language: '5'
          - xcode: '26.2'
            language: '6'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Test with complete concurrency checks
        run: swift test -Xswiftc -swift-version -Xswiftc ${{ matrix.language }} -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Build release
        run: swift build -c release -Xswiftc -swift-version -Xswiftc ${{ matrix.language }} -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Test upcoming async isolation rules
        if: matrix.language == '6'
        run: swift test -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -enable-upcoming-feature -Xswiftc NonisolatedNonsendingByDefault -Xswiftc -warnings-as-errors

  minimum-toolchain:
    name: Oldest available toolchain build
    # Package.swift declares Swift 5.9, but GitHub-hosted runners no longer
    # provide Xcode 15. Xcode 16.0 (Swift 6.0) is the oldest toolchain CI can
    # build with; Swift 5.9 and 5.10 are not verified.
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c release -Xswiftc -warnings-as-errors
      - run: swift build -c release -Xswiftc -swift-version -Xswiftc 5 -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  platforms:
    name: Minimum deployment / ${{ matrix.sdk }}
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphoneos
            target: arm64-apple-ios13.0
          - sdk: appletvos
            target: arm64-apple-tvos13.0
          - sdk: macosx
            target: x86_64-apple-macosx10.15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Compile library at its minimum deployment target
        run: >-
          xcrun swiftc -parse-as-library -emit-module -module-name VVSI
          -sdk "$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)"
          -target ${{ matrix.target }}
          -swift-version 5 -strict-concurrency=complete -warnings-as-errors
          -emit-module-path "$RUNNER_TEMP/VVSI.swiftmodule" Source/VVSI/*.swift

  example:
    name: Example App tests
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Choose an available iPhone simulator
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          matches = [d["udid"] for runtime, group in devices.items()
                     if runtime.endswith("iOS-18-5") for d in group
                     if d["name"].startswith("iPhone") and d["isAvailable"]]
          if not matches:
              raise SystemExit("No iOS 18.5 iPhone simulator available")
          print(matches[0])')
          echo "SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
      - name: Run app tests
        working-directory: VVSIExample
        run: >-
          xcodebuild -project VVSIExample.xcodeproj -scheme VVSIExample
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -resultBundlePath "$RUNNER_TEMP/ExampleTests.xcresult"
          CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: example-test-results
          path: ${{ runner.temp }}/ExampleTests.xcresult
