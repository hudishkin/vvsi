name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    name: Swift Package
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests with strict concurrency
        run: swift test -Xswiftc -strict-concurrency=complete

      - name: Build release configuration
        run: swift build --configuration release

  example:
    name: Example App
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app and test target
        working-directory: VVSIExample
        run: >-
          xcodebuild
          -project VVSIExample.xcodeproj
          -scheme VVSIExample
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
          build-for-testing
